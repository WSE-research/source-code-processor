name: Build and Release

on: 
  - push
  - workflow_dispatch


jobs: 

  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        distribution: 'temurin'
        java-version: '17'
        server-id: 'central'
        server-username: MAVEN_TOKEN_USERNAME # i.e. the token username
        server-password: MAVEN_TOKEN_PASSWORD # i.e. the token password
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} 
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Deploy and Release artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run:  |
      if [ -z "$ARTIFACTS_TO_BE_RELEASED" ]; then
        echo "No artifacts to be released."
      else
        echo "Releasing artifacts: $ARTIFACTS_TO_BE_RELEASED"
        mvn clean deploy -Dcentral.publish=true -Dgpg.keyname="$MAVEN_GPG_KEYNAME" -pl "$ARTIFACTS_TO_BE_RELEASED"
      fi
      env:
      MAVEN_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      MAVEN_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_GPG_KEYNAME: ${{ secrets.MAVEN_GPG_KEYNAME }}